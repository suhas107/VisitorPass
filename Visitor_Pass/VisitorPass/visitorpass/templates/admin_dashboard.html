{% extends 'base.html' %}
{% block content %}
<h2>Admin Dashboard</h2>
<div class="row">
  <div class="col-md-4">
    <div class="card"><div class="card-body">Users: {{ user_count }}</div></div>
  </div>
  <div class="col-md-4">
    <div class="card"><div class="card-body">Logs: {{ log_count }}</div></div>
  </div>
</div>
<div class="mt-3">
  <a class="btn btn-primary" href="{{ url_for('admin.manage_users') }}">Manage Users</a>
  <a class="btn btn-secondary" href="{{ url_for('admin.all_logs') }}">View Logs</a>
</div>
{% endblock %}
