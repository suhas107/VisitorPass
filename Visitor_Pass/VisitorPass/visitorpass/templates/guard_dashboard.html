{% extends 'base.html' %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <h2 class="dp-section-title mb-0">Guard Dashboard</h2>
    <div class="dp-subtle">Scan, verify, and log every entry.</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-primary" href="{{ url_for('rp.guard_scan') }}">Open Scanner</a>
    <a class="btn btn-secondary" href="{{ url_for('rp.directory') }}">Resident Directory</a>
  </div>
</div>
<div class="row g-3">
  <div class="col-lg-12">
    <div class="dp-card h-100">
      <h5 class="mb-3">Recent Logs</h5>
      {% include 'logs_table.html' with context %}
    </div>
  </div>
</div>
{% endblock %}
